<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Navegación mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0; font-family:'Inter',system-ui,-apple-system,sans-serif;}
  .row{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border-bottom:1px solid #E2E8F0;box-sizing:border-box;}
  .stripe{width:4px;align-self:stretch;border-radius:2px;}
  .chip{font-size:11px;color:#64748B;background:#F1F5F9;border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px;}
  .icon{width:20px;height:20px;display:inline-block;vertical-align:middle;}
</style>
</helmet>

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
<defs>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-more-vertical" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="19" r="1.3" fill="currentColor"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="12" y1="9" x2="12" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.5" r="0.9" fill="currentColor"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21 12 17.77 5.82 21 7 14.14 2 9.27 8.91 8.26" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 0 1-3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4.5l1.5 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.6" y2="16.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="6" r="2" fill="#F8FAFC" stroke="currentColor" stroke-width="2"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="12" r="2" fill="#F8FAFC" stroke="currentColor" stroke-width="2"/><line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="18" r="2" fill="#F8FAFC" stroke="currentColor" stroke-width="2"/></symbol>
</defs>
</svg>

<div style="width:390px;height:844px;background:#F8FAFC;display:flex;flex-direction:column;box-sizing:border-box;border:1px solid #E2E8F0;border-radius:28px;overflow:hidden;position:relative;">

  <!-- Header: breadcrumb + sync -->
  <div style="height:56px;min-height:56px;background:#FFFFFF;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;padding:0 12px;gap:8px;box-sizing:border-box;">
    <button aria-label="Volver" style="width:32px;height:32px;border:none;background:none;color:#0F172A;display:flex;align-items:center;justify-content:center;"><svg class="icon"><use href="#i-chevron-left"></use></svg></button>
    <div style="flex-grow:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">… › Cliente X › Proyecto</div>
    <button aria-label="Más opciones" style="width:32px;height:32px;border:none;background:none;color:#64748B;display:flex;align-items:center;justify-content:center;"><svg class="icon"><use href="#i-more-vertical"></use></svg></button>
  </div>
  <div style="padding:4px 16px;font-size:11px;color:#64748B;display:flex;align-items:center;gap:6px;background:#FFFFFF;border-bottom:1px solid #E2E8F0;">
    <span style="width:6px;height:6px;border-radius:999px;background:#22C55E;display:inline-block;"></span> Sincronizado
  </div>

  <!-- Content -->
  <div style="flex-grow:1;overflow:hidden;">
    <div style="padding:12px 16px 4px;font-size:12px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:.04em;">Subcarpetas</div>
    <div class="row">
      <div class="stripe" style="background:#3B82F6;"></div>
      <div style="width:10px;height:10px;border-radius:999px;background:#3B82F6;"></div>
      <div style="flex-grow:1;font-size:15px;">Frontend</div>
      <div class="chip">3 pend.</div>
    </div>
    <div class="row">
      <div class="stripe" style="background:#22C55E;"></div>
      <div style="width:10px;height:10px;border-radius:999px;background:#22C55E;"></div>
      <div style="flex-grow:1;font-size:15px;">Backend</div>
      <div class="chip" style="color:#EF4444;background:#FEF2F2;"><svg class="icon" width="12" height="12"><use href="#i-alert"></use></svg> vencida</div>
    </div>
    <div style="padding:12px 16px 4px;font-size:12px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:.04em;">Tareas</div>
    <div class="row">
      <div class="stripe" style="background:#A855F7;"></div>
      <div style="width:20px;height:20px;border:2px solid #CBD5E1;border-radius:6px;"></div>
      <div style="flex-grow:1;font-size:15px;">Revisar contrato</div>
      <div class="chip">Hoy</div>
    </div>
    <div class="row">
      <div class="stripe" style="background:transparent;"></div>
      <div style="width:20px;height:20px;border:2px solid #CBD5E1;border-radius:6px;"></div>
      <div style="flex-grow:1;font-size:15px;display:flex;align-items:center;gap:6px;"><svg class="icon" width="15" height="15" style="color:#F59E0B;"><use href="#i-star"></use></svg> Enviar factura</div>
      <span style="color:#64748B;display:flex;"><svg class="icon" width="16" height="16"><use href="#i-bell"></use></svg></span>
    </div>
  </div>

  <!-- FAB -->
  <button aria-label="Crear tarea" style="position:absolute;right:16px;bottom:88px;width:56px;height:56px;border-radius:999px;background:#4F46E5;color:#fff;border:none;box-shadow:0 4px 16px rgba(15,23,42,.2);display:flex;align-items:center;justify-content:center;"><svg class="icon" width="24" height="24"><use href="#i-plus"></use></svg></button>

  <!-- Bottom nav -->
  <div style="height:64px;background:#FFFFFF;border-top:1px solid #E2E8F0;display:flex;">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#4F46E5;">
      <svg class="icon" width="22" height="22"><use href="#i-folder"></use></svg><span style="font-size:11px;font-weight:600;">Carpetas</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#64748B;">
      <svg class="icon" width="22" height="22"><use href="#i-calendar"></use></svg><span style="font-size:11px;">Hoy</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#64748B;">
      <svg class="icon" width="22" height="22"><use href="#i-search"></use></svg><span style="font-size:11px;">Buscar</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#64748B;">
      <svg class="icon" width="22" height="22"><use href="#i-settings"></use></svg><span style="font-size:11px;">Ajustes</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
